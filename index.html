<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lactoceleiro — APP Produção</title>
<style>
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#0f2340; color:#fff; display:flex; align-items:center;
         justify-content:center; height:100vh; }
  .cx { text-align:center; padding:24px; }
  .t  { font-size:15px; font-weight:700; letter-spacing:.02em; }
  .s  { font-size:12px; color:#94a3b8; margin-top:8px; }
  a   { color:#fbbf24; }
</style>
</head>
<body>
<div class="cx">
  <div class="t">A abrir a APP Produção…</div>
  <div class="s" id="alt"></div>
</div>
<script>
/*
  ESTE FICHEIRO NUNCA MAIS MUDA.

  A app verdadeira está em app.html. É esse que se substitui a cada versão.

  Porquê: o browser guarda as páginas que já viu e continua a servir a
  cópia velha, mesmo depois do ficheiro mudar no servidor. Era por isso
  que um aparelho ficava na versão 41 e outro na 43, e só se resolvia
  abrindo à mão com ?v=43.

  O endereço para onde isto salta leva uma marca que muda de dez em dez
  minutos. Dentro desse intervalo o browser usa a cópia que já tem — abre
  depressa e funciona mesmo sem rede. Passado esse tempo o endereço é
  outro, o browser não tem nada guardado para ele, e vai buscar a versão
  nova sozinho.
*/
(function () {
  var destino = 'app.html';
  try {
    var m = String(location.search || '').match(/[?&]v=([^&]+)/);
    // Se alguém abrir com ?v= à mão, respeita-se essa marca.
    var marca = m ? decodeURIComponent(m[1]) : String(Math.floor(Date.now() / 600000));
    destino = 'app.html?v=' + encodeURIComponent(marca);
  } catch (e) {}
  try {
    document.getElementById('alt').innerHTML =
      'Se não abrir sozinha, <a href="' + destino + '">toque aqui</a>.';
  } catch (e) {}
  location.replace(destino);
})();
</script>
<noscript>
  <div class="cx">É preciso ter o JavaScript ligado. <a href="app.html">Abrir a app</a>.</div>
</noscript>
</body>
</html>
